<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>금형 조회 · Buscador de Moldes</title>
<style>
  :root{
    --bg:#0E1014; --panel:#171A21; --panel-2:#1E222B; --line:#2A2F3A;
    --ink:#F4F6FA; --ink-dim:#9AA3B2; --ink-faint:#646C7B;
    --amber:#F5A623; --amber-soft:rgba(245,166,35,.12);
    --green:#39C07A; --blue:#4D9EFF; --red:#F2607A; --gray:#8A93A3;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(245,166,35,.07), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px;min-height:100%}

  /* Header */
  header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .mark{
    width:40px;height:40px;border-radius:10px;flex:none;
    background:linear-gradient(145deg,var(--amber),#D4860C);
    display:grid;place-items:center;position:relative;
    box-shadow:0 4px 14px rgba(245,166,35,.28);
  }
  .mark svg{width:22px;height:22px;display:block}
  .ttl{display:flex;flex-direction:column;gap:1px}
  .ttl h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .ttl span{font-size:11px;color:var(--ink-faint);font-family:var(--mono);letter-spacing:.02em}
  .count{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-faint);line-height:1.3}
  .count b{display:block;color:var(--amber);font-size:15px}

  /* Search */
  .search{position:relative;margin-bottom:8px}
  .search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none}
  #q{
    width:100%;background:var(--panel);border:1.5px solid var(--line);
    border-radius:14px;color:var(--ink);font-family:var(--mono);
    font-size:18px;font-weight:600;letter-spacing:.06em;
    padding:17px 50px 17px 46px;outline:none;text-transform:uppercase;
    transition:border-color .15s, box-shadow .15s;
  }
  #q::placeholder{color:var(--ink-faint);letter-spacing:.02em;font-weight:500;text-transform:none}
  #q:focus{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
  .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border:none;background:var(--panel-2);border-radius:8px;
    color:var(--ink-dim);font-size:16px;cursor:pointer;display:none;place-items:center}
  .clear.show{display:grid}
  .hint{font-size:11.5px;color:var(--ink-faint);padding:2px 4px 14px;font-family:var(--mono)}

  /* Suggestions */
  .sugg{display:flex;flex-direction:column;gap:7px}
  .item{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:12px;
    transition:border-color .12s, background .12s;
  }
  .item:hover,.item.active{border-color:var(--amber);background:var(--panel-2)}
  .item .pn{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--ink)}
  .item .pn em{font-style:normal;color:var(--amber);background:var(--amber-soft);border-radius:3px;padding:0 1px}
  .item .nm{font-size:12px;color:var(--ink-dim);margin-left:auto;text-align:right;
    max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .dot{width:7px;height:7px;border-radius:50%;flex:none}

  /* Result card */
  .card{
    background:linear-gradient(180deg,var(--panel),#13161C);
    border:1px solid var(--line);border-radius:18px;overflow:hidden;
    animation:rise .22s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card .top{padding:18px 20px 16px;border-bottom:1px solid var(--line);position:relative}
  .card .top::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber)}
  .pnbig{font-family:var(--mono);font-size:27px;font-weight:800;letter-spacing:.04em;line-height:1.1}
  .name{font-size:13px;color:var(--ink-dim);margin-top:5px;word-break:break-word}
  .badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;
    font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;font-family:var(--mono);letter-spacing:.02em}
  .badge .dot{width:7px;height:7px;border-radius:50%}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .cell{background:var(--panel);padding:15px 18px;min-height:78px}
  .cell.full{grid-column:1 / -1}
  .lbl{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);
    letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:baseline}
  .lbl .es{color:var(--ink-faint);opacity:.7}
  .val{font-size:21px;font-weight:700;margin-top:7px;letter-spacing:-.01em;word-break:break-word}
  .val.mono{font-family:var(--mono);letter-spacing:.02em}
  .val small{font-size:12px;color:var(--ink-dim);font-weight:600;margin-left:3px}
  .val.empty{color:var(--ink-faint);font-weight:500;font-size:15px}

  /* states */
  .empty-state,.noresult{text-align:center;padding:46px 20px;color:var(--ink-faint)}
  .empty-state svg{opacity:.35;margin-bottom:14px}
  .empty-state p{font-size:13.5px;line-height:1.6}
  .noresult b{color:var(--ink-dim);font-family:var(--mono)}
  .foot{text-align:center;margin-top:26px;font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);letter-spacing:.03em}
</style>
</head>

"}, {"partno": "ET080A", "name": "DRV SWITCH", "model": "ON", "weight": "", "location": "AT12", "planta": "PLANTA 1", "status": "OBSOLETO"}];
const NORM = s => (s||'').toString().toUpperCase().replace(/[\s\-_]/g,'');
DATA.forEach(d => d._k = NORM(d.partno));
document.getElementById('cTot').textContent = DATA.length.toLocaleString();

const q=document.getElementById('q'), out=document.getElementById('out'), clr=document.getElementById('clr');
let activeIdx=-1, current=[];

function statusStyle(s){
  const t=(s||'').toLowerCase();
  if(t.includes('양산')||t.includes('produc')) return {c:'var(--green)',label:s||'-'};
  if(t.includes('obsolet')) return {c:'var(--gray)',label:s};
  if(t.includes('desarrollo')&&!t.includes('canc')) return {c:'var(--blue)',label:s};
  if(t.includes('canc')) return {c:'var(--red)',label:s};
  if(t==='del') return {c:'var(--red)',label:s};
  return {c:'var(--amber)',label:s||'-'};
}
function esc(x){return (x==null?'':String(x)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function val(v,cls){ if(v===''||v==null) return '<div class="val empty">— 정보 없음</div>';
  return '<div class="val '+(cls||'')+'">'+esc(v)+'</div>'; }

function renderCard(d){
  const st=statusStyle(d.status);
  const wt = d.weight===''||d.weight==null ? '' : Number(d.weight).toLocaleString(undefined,{maximumFractionDigits:1});
  out.innerHTML = `
   <div class="card">
     <div class="top">
       <div class="pnbig">${esc(d.partno)}</div>
       ${d.name?`<div class="name">${esc(d.name)}</div>`:''}
       <span class="badge" style="background:${st.c}1f;color:${st.c}">
         <span class="dot" style="background:${st.c}"></span>${esc(st.label||'-')}
       </span>
     </div>
     <div class="grid">
       <div class="cell full">
         <div class="lbl">차종 <span class="es">PROYECTO</span></div>
         ${val(d.model,'')}
       </div>
       <div class="cell">
         <div class="lbl">중량 <span class="es">PESO</span></div>
         ${wt!==''?`<div class="val mono">${wt}<small>kg</small></div>`:val('')}
       </div>
       <div class="cell">
         <div class="lbl">현재위치 <span class="es">UBIC.</span></div>
         ${val(d.location,'mono')}
       </div>
       <div class="cell">
         <div class="lbl">PLANTA <span class="es">공장</span></div>
         ${val(d.planta,'mono')}
       </div>
       <div class="cell">
         <div class="lbl">금형상태 <span class="es">ESTADO</span></div>
         <div class="val" style="color:${st.c};font-size:17px">${esc(d.status||'—')}</div>
       </div>
     </div>
   </div>`;
}

function emptyState(){
  out.innerHTML = `<div class="empty-state">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
    <p>품번을 입력해 정보를 조회하세요.<br>Escriba el número de molde para buscar.</p>
  </div>`;
}

function hl(pn,k){
  const u=pn.toUpperCase(), i=u.replace(/[\s\-_]/g,'').indexOf(k);
  if(k===''||i<0) return esc(pn);
  // map normalized index back roughly: simple highlight on raw prefix
  const ri=u.indexOf(k[0]); if(ri<0) return esc(pn);
  return esc(pn.slice(0,ri))+'<em>'+esc(pn.slice(ri,ri+k.length))+'</em>'+esc(pn.slice(ri+k.length));
}

function renderList(list,k){
  current=list; activeIdx=-1;
  if(!list.length){
    out.innerHTML=`<div class="noresult">일치하는 품번이 없습니다<br><b>${esc(q.value)}</b><br><span style="font-size:12px">No se encontró el molde</span></div>`;
    return;
  }
  out.innerHTML='<div class="sugg">'+list.map((d,i)=>{
    const st=statusStyle(d.status);
    return `<div class="item" data-i="${i}">
       <span class="dot" style="background:${st.c}"></span>
       <span class="pn">${hl(d.partno,k)}</span>
       <span class="nm">${esc(d.name||'')}</span>
     </div>`;
  }).join('')+'</div>';
  out.querySelectorAll('.item').forEach(el=>{
    el.onclick=()=>{ const d=current[+el.dataset.i]; q.value=d.partno; clr.classList.add('show'); renderCard(d); };
  });
}

function search(){
  const raw=q.value; const k=NORM(raw);
  clr.classList.toggle('show', raw.length>0);
  if(k===''){ emptyState(); current=[]; return; }
  const exact=DATA.find(d=>d._k===k);
  if(exact){ renderCard(exact); return; }
  const pre=DATA.filter(d=>d._k.startsWith(k));
  const inc=pre.length<8 ? DATA.filter(d=>!d._k.startsWith(k)&&d._k.includes(k)) : [];
  renderList(pre.concat(inc).slice(0,40), k);
}

q.addEventListener('input',search);
q.addEventListener('keydown',e=>{
  const items=out.querySelectorAll('.item'); if(!items.length) return;
  if(e.key==='ArrowDown'){e.preventDefault();activeIdx=Math.min(activeIdx+1,items.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();activeIdx=Math.max(activeIdx-1,0);}
  else if(e.key==='Enter'){e.preventDefault();const t=activeIdx<0?0:activeIdx;items[t]&&items[t].click();return;}
  else return;
  items.forEach((el,i)=>el.classList.toggle('active',i===activeIdx));
  items[activeIdx]&&items[activeIdx].scrollIntoView({block:'nearest'});
});
clr.onclick=()=>{q.value='';clr.classList.remove('show');emptyState();q.focus();};
emptyState(); q.focus();
</script>
